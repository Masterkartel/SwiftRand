# SwiftRand – Cloudflare Worker v4
name       = "swiftrand-worker"
main       = "worker.js"
compatibility_date = "2024-01-01"

# No KV namespace needed — OTT is forwarded to Telegram as-is.

# Secrets — set with wrangler CLI (never commit real values):
#   wrangler secret put TELEGRAM_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put ALLOWED_ORIGIN

[vars]
ALLOWED_ORIGIN = "https://swiftrand.co.za"
